<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Achini & Chinthaka">
  <defs>
    <linearGradient id="ringGold" x1="6" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5DE97"/>
      <stop offset="0.45" stop-color="#E8B238"/>
      <stop offset="1" stop-color="#96680F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="32" y2="32">
      <stop stop-color="#FEFDF9"/>
      <stop offset="1" stop-color="#FAF0DD"/>
    </linearGradient>
  </defs>
  <!-- Soft invitation tile -->
  <rect width="32" height="32" rx="8" fill="url(#panel)"/>
  <rect width="32" height="32" rx="8" fill="none" stroke="#C9973A" stroke-opacity="0.35" stroke-width="1"/>
  <!-- Interlocking rings -->
  <circle cx="12.25" cy="16" r="6.35" fill="none" stroke="url(#ringGold)" stroke-width="2.05" stroke-linecap="round"/>
  <circle cx="19.75" cy="16" r="6.35" fill="none" stroke="url(#ringGold)" stroke-width="2.05" stroke-linecap="round"/>
  <!-- Tiny ceremonial sparkle -->
  <circle cx="16" cy="9" r="1.15" fill="#E8B238" opacity="0.9"/>
</svg>
